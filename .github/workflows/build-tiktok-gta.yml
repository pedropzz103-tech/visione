name: Build GTA VI TikTok test

on:
  push:
    paths:
      - '.github/workflows/build-tiktok-gta.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Build 9x16 motion video
        run: |
          mkdir -p media/social/2026/08
          ffmpeg -y -loop 1 -i media/social/2026/08/gta6-visione-test.jpg \
            -vf "scale=380:-1,zoompan=z='min(zoom+0.00035,1.05)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=144:s=360x640:fps=24" \
            -t 6 -an -c:v libx264 -preset slow -crf 35 -pix_fmt yuv420p -movflags +faststart \
            media/social/2026/08/gta6-visione-test.mp4
      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/social/2026/08/gta6-visione-test.mp4
          git commit -m "Build GTA VI TikTok test video" || exit 0
          git push
