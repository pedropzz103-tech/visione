name: VISIONE site quality

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source syntax
        run: npm run lint
      - name: Check data interfaces
        run: npm run typecheck
      - name: Run test suite
        run: npm test
      - name: Build static discovery pages
        run: npm run build
      - name: Validate generated site
        run: node scripts/validate.mjs
