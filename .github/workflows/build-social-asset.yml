name: Build social asset

on:
  push:
    paths:
      - 'media/social-src/2026/08/gta6-visione-test.manifest'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode GTA VI social image
        run: |
          mkdir -p media/social/2026/08
          cat \
            media/social-src/2026/08/gta6-visione-test.part0 \
            media/social-src/2026/08/gta6-visione-test.part1 \
            media/social-src/2026/08/gta6-visione-test.part2 \
            media/social-src/2026/08/gta6-visione-test.part3 \
            media/social-src/2026/08/gta6-visione-test.part4 \
            media/social-src/2026/08/gta6-visione-test.part5 \
            | tr -d '\n\r ' | base64 -d > media/social/2026/08/gta6-visione-test.jpg
          file media/social/2026/08/gta6-visione-test.jpg
          test "$(git hash-object media/social/2026/08/gta6-visione-test.jpg)" = "f2e9c12e85c3da717b3bb39e588fdbb98a0c2cfc"
      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/social/2026/08/gta6-visione-test.jpg
          git commit -m "Build valid GTA VI social asset" || exit 0
          git push
