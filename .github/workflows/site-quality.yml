name: VISIONE site quality

on:
  push:
    branches:
      - main
      - 'visione-wire-*'
      - 'feat/visione-streaming-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build streaming discovery pages
        run: node streaming/build.mjs
      - name: Validate generated streaming site
        run: node streaming/validate.mjs
      - name: Run site quality tests
        run: node --test tests/*.test.mjs
