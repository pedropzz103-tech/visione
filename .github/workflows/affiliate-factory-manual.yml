name: Affiliate Factory - manual intake

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Automatically publish every valid Telegram product
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: affiliate-factory-publication
  cancel-in-progress: false

jobs:
  affiliate-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: affiliate-factory
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
      R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
      BUFFER_THREADS_CHANNEL_ID: ${{ secrets.BUFFER_THREADS_CHANNEL_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
      AFFILIATE_PUBLISH: ${{ inputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: affiliate-factory/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Verify bundled media binaries
        run: node --input-type=module -e "import ffmpeg from 'ffmpeg-static'; import ffprobe from 'ffprobe-static'; if (!ffmpeg || !ffprobe.path) process.exit(1)"

      - name: Collect pending manual Telegram products
        run: node dist/cli.js telegram-poll --output .tmp/telegram-inbox > telegram-result.json

      - name: Run every collected product automatically
        run: >-
          node --input-type=module -e
          "import {readFileSync} from 'node:fs'; import {execFileSync} from 'node:child_process';
          const {bundles}=JSON.parse(readFileSync('telegram-result.json','utf8'));
          for (const bundle of bundles) {
            const args=['dist/cli.js','run','--bundle',bundle,'--mode','production'];
            if (process.env.AFFILIATE_PUBLISH === 'true') args.push('--publish');
            execFileSync(process.execPath,args,{stdio:'inherit'});
          }"

      - name: Commit Telegram offset after every product succeeds
        run: >-
          node --input-type=module -e
          "import {readFileSync} from 'node:fs'; import {execFileSync} from 'node:child_process';
          const {nextOffset}=JSON.parse(readFileSync('telegram-result.json','utf8'));
          execFileSync(process.execPath,['dist/cli.js','telegram-commit','--offset',String(nextOffset)],{stdio:'inherit'});"

      - name: Upload secret-free diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-factory-diagnostics-${{ github.run_id }}
          path: affiliate-factory/telegram-result.json
          if-no-files-found: ignore
          retention-days: 7
