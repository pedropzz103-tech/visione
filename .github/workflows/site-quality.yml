name: VISIONE site quality

on:
  push:
    branches:
      - main
      - 'visione-wire-*'
      - 'feat/visione-streaming-*'
      - 'deploy/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build current streaming discovery pages
        run: node streaming/build.mjs
      - name: Run current site quality tests
        run: node --test tests/site.test.mjs tests/streaming.test.mjs tests/data-credits.test.mjs
      - name: Validate Codex discovery source contracts
        run: |
          npm run lint
          npm run typecheck
      - name: Run Codex discovery tests
        run: node --test tests/build.test.mjs tests/calendar.test.mjs tests/catalog.test.mjs tests/client-i18n.test.mjs tests/search.test.mjs tests/seo.test.mjs tests/validation.test.mjs
      - name: Build Codex discovery in CI workspace
        run: npm run build
      - name: Validate Codex discovery build
        run: node scripts/validate.mjs
