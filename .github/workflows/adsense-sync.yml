name: Editorial inventory sync

on:
  push:
    paths:
      - '.github/workflows/adsense-sync.yml'
      - 'scripts/editorial_inventory_sync.py'
      - 'scripts/materialize_streaming_nav.py'
      - 'news/*.html'
      - 'news/feed.xml'
      - 'news/news-sitemap.xml'
      - 'projects/**/*.html'
      - 'contact/**/*.html'
      - 'legal/**/*.html'
      - 'privacy/**/*.html'
      - 'carluxiii/**/*.html'
      - 'carluxiii-preview/**/*.html'
      - 'nomadbycarlos/**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'index.html'
      - 'es/index.html'
      - 'pt/index.html'
      - 'br/index.html'
      - 'data-credits/index.html'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Normalize editorial inventory and discovery surface
        run: |
          python3 scripts/editorial_inventory_sync.py
          python3 scripts/materialize_streaming_nav.py
      - name: Commit normalized inventory
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "VISIONE automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sync VISIONE editorial and discovery surfaces"
          git push origin "HEAD:${GITHUB_REF_NAME}"
