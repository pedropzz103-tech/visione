name: VISIONE brand website checks
on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/site-quality.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check global brand home
        run: |
          test -s index.html
          grep -q "Digital solutions & AI automation" index.html
          grep -q "contact@visione.one" index.html
          grep -q 'lang="en"' index.html
          grep -q 'id="servicios"' index.html
          grep -q 'id="precios"' index.html
          grep -q "Business automation" index.html
          grep -q 'class="brand-logo" src="/visione-logo.webp" alt="VISIONE"' index.html
          grep -q 'class="hero hero-refined"' index.html
          grep -q '.hero-art{display:none}' index.html
          ! grep -q 'class="preview"' index.html
          ! grep -q 'class="floater"' index.html
          ! grep -q "Onde assistir filmes" index.html
