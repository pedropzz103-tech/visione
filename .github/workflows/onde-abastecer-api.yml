name: Onde Abastecer API

on:
  push:
    branches:
      - feature/onde-abastecer-mvp
      - main
    paths:
      - "onde-abastecer/api/**"
      - ".github/workflows/onde-abastecer-api.yml"
  pull_request:
    paths:
      - "onde-abastecer/api/**"
      - ".github/workflows/onde-abastecer-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onde-abastecer-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onde-abastecer/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: onde-abastecer/api/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Cloudflare deploy credentials
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Deploy Cloudflare Worker
        if: steps.credentials.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: onde-abastecer/api
          command: deploy
