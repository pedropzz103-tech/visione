name: VISIONE editorial patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visione-editorial-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage and feeds
        shell: python
        run: |
          import re
          from pathlib import Path

          slug = 'us-iran-trade-strikes-hormuz-september-2-2026.html'
          url = 'https://visione.one/news/' + slug
          image = 'https://media.defense.gov/2026/Jul/31/2003973284/3996/3996/0/260729-N-QP244-1093.JPG'
          title = 'U.S. and Iran trade strikes as Hormuz tensions flare again'
          desc = 'A renewed exchange of strikes has put Gulf military bases, commercial shipping and the Strait of Hormuz back under pressure.'
          card = f'<article class="story-card"><a href="news/{slug}"><div class="story-image"><img src="{image}" alt="A U.S. sailor conducts night flight operations aboard USS George H.W. Bush in the U.S. 5th Fleet area" loading="lazy"></div><div class="story-copy"><p class="eyebrow">WORLD / GEOPOLITICS / MIDDLE EAST / ENERGY</p><h3>{title}</h3><p>{desc}</p><div class="story-meta">September 2, 2026 · VISIONE Wire</div></div></a></article>'

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          feature = f'<article class="feature-story"><a href="news/{slug}"><img src="{image}" alt="A U.S. sailor conducts night flight operations aboard USS George H.W. Bush in the U.S. 5th Fleet area"><div class="feature-content"><p class="feature-kicker">FEATURED · WORLD · GEOPOLITICS · MIDDLE EAST</p><h1>U.S. and Iran trade strikes again.</h1><p>A renewed military exchange puts the Strait of Hormuz, Gulf bases and energy markets back under pressure.</p><div class="feature-meta"><span>September 2, 2026 · VISIONE Wire</span><span class="feature-cta">Read the full story →</span></div></div></a></article>'
          s = re.sub(r'<article class="feature-story">.*?</article>', feature, s, count=1, flags=re.S)
          s = re.sub(r'<meta property="og:image" content="[^"]+">', f'<meta property="og:image" content="{image}">', s, count=1)
          ticker = f'<div class="ticker" aria-label="Top story"><span>JUST IN</span><strong>{title}</strong><a href="news/{slug}">Read the full story →</a></div>'
          s = re.sub(r'<div class="ticker" aria-label="Top story">.*?</div>', ticker, s, count=1, flags=re.S)
          s = re.sub(r'<span class="live-chip">\d+ reports · [^<]+</span>', '<span class="live-chip">52 reports · Sep 2, 2026</span>', s, count=1)
          s = re.sub(r'<article class="story-card"><a href="news/' + re.escape(slug) + r'">.*?</article>', '', s, flags=re.S)
          marker = '<div class="news-grid news-grid-expanded">'
          s = s.replace(marker, marker + card, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(<url><loc>https://visione.one/</loc><lastmod>)\d{4}-\d{2}-\d{2}(</lastmod></url>)', r'\g<1>2026-09-02\g<2>', s)
          if url in s:
              s = re.sub(r'(<url><loc>' + re.escape(url) + r'</loc><lastmod>)\d{4}-\d{2}-\d{2}(</lastmod></url>)', r'\g<1>2026-09-02\g<2>', s)
          else:
              marker = '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              s = s.replace(marker, marker + f'  <url><loc>{url}</loc><lastmod>2026-09-02</lastmod></url>\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('news/news-sitemap.xml')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<url><loc>' + re.escape(url) + r'</loc>.*?</url>', '', s, flags=re.S)
          entry = f'  <url><loc>{url}</loc><news:news><news:publication><news:name>VISIONE Wire</news:name><news:language>en</news:language></news:publication><news:publication_date>2026-09-02T17:58:00+02:00</news:publication_date><news:title>{title}</news:title></news:news></url>\n'
          marker = '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:news="http://www.google.com/schemas/sitemap-news/0.9">\n'
          s = s.replace(marker, marker + entry, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('news/feed.xml')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<lastBuildDate>.*?</lastBuildDate>', '<lastBuildDate>Wed, 02 Sep 2026 15:58:00 GMT</lastBuildDate>', s, count=1)
          s = re.sub(r'<item><title>.*?</title><link>' + re.escape(url) + r'</link>.*?</item>', '', s, flags=re.S|re.I)
          item = f'<item><title>{title}</title><link>{url}</link><guid isPermaLink="true">{url}</guid><pubDate>Wed, 02 Sep 2026 15:58:00 GMT</pubDate><description>{desc}</description></item>\n'
          first = s.find('<item>')
          if first != -1:
              s = s[:first] + item + s[first:]
          else:
              s = s.replace('</channel>', item + '</channel>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit editorial sync
        run: |
          git config user.name "VISIONE Wire Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sitemap.xml news/news-sitemap.xml news/feed.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "wire: sync US-Iran strikes and Hormuz coverage"
          git push
