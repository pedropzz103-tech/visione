name: Onde Abastecer Mobile

on:
  push:
    branches:
      - feature/onde-abastecer-mvp
      - main
    paths:
      - "onde-abastecer/mobile/**"
      - ".github/workflows/onde-abastecer-mobile.yml"
  pull_request:
    paths:
      - "onde-abastecer/mobile/**"
      - ".github/workflows/onde-abastecer-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onde-abastecer-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onde-abastecer/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: onde-abastecer/mobile/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Expo doctor
        run: npx expo-doctor@latest
