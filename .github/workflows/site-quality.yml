name: VISIONE site quality

on:
  push:
    branches:
      - main
      - 'visione-wire-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run site quality tests
        run: node --test tests/site.test.mjs
